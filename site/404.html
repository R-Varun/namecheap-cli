  <style>
    :root {
      color-scheme: dark;
      --bg: #080A0D;
      --bg-card: #13171C;
      --line-strong: #3B444E;
      --ink: #EDF2F5;
      --muted: #98A4AE;
      --accent: #8ADAE6;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    main {
      max-width: 460px;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      padding: 36px 32px;
    }
    .code {
      font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--accent);
      letter-spacing: 0.08em;
    }
    h1 { margin: 12px 0 10px; font-size: 28px; letter-spacing: -0.02em; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; font-size: 15px; }
    a {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404 · NXDOMAIN</div>
    <h1>Page not found</h1>
    <p>That path does not exist on the Namecheap CLI documentation site.</p>

  </main>
</body>
